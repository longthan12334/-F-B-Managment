user  nginx;
worker_processes  auto;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;
  sendfile      on;
  keepalive_timeout 65;
  client_max_body_size 25m;

  # Buổi 8: ánh xạ Connection upgrade cho WebSocket.
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  # Rate limit tầng NGINX cho public API (BE-1).
  # 10 request/giây/IP, burst 20 — làm hàng chắn đầu trước .NET middleware.
  limit_req_zone $binary_remote_addr zone=public_api:10m rate=10r/s;

  # Upstream backend staff (Node.js)
  upstream restomanager_backend {
    server backend:3000;
  }

  # Upstream customer-api (.NET) — BE-1
  # Có thể thêm nhiều server vào đây cho load balancing (Buổi 8).
  upstream restomanager_customer_api {
    server customer-api:5000;
  }

  server {
    listen       80;
    server_name  _;
    root         /usr/share/nginx/html;
    index        index.html;

    # ─── Staff API (Node.js) ──────────────────────────────────────────
    location /api/ {
      proxy_pass         http://restomanager_backend/api/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 60s;
    }

    # ─── Customer public API (.NET) — BE-1 ────────────────────────────
    location /public-api/ {
      limit_req zone=public_api burst=20 nodelay;

      proxy_pass         http://restomanager_customer_api/public-api/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 30s;
    }

    # ─── Socket.IO (WebSocket) ────────────────────────────────────────
    location /socket.io/ {
      proxy_pass         http://restomanager_backend/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering    off;
    }

    # ─── Static assets từ Vite build ──────────────────────────────────
    location /assets/ {
      try_files $uri =404;
      expires 30d;
      access_log off;
      add_header Cache-Control "public, immutable";
    }

    # ─── React SPA fallback ──────────────────────────────────────────
    location / {
      try_files $uri $uri/ /index.html;
    }
  }
}
