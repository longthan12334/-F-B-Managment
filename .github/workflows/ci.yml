# =============================================================================
#  GitHub Actions CI/CD — RestoManager
#
#  Thay thế Jenkins (giảng viên lo build fail làm sập VPS tự host).
#  Workflow này chạy trên runner của GitHub (ubuntu-latest), KHÔNG đụng VPS.
#  Deploy VPS vẫn làm thủ công (ssh + docker compose pull && up -d) hoặc dùng
#  workflow_dispatch sau khi mọi test pass.
#
#  Áp dụng Buổi 10 (CI/CD) + Buổi 11 (Dev/Staging/Prod).
# =============================================================================

name: CI

on:
  push:
    branches: [main, develop, "feature/**"]
  pull_request:
    branches: [main, develop]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # ─── 1. Node.js backend (staff) ──────────────────────────────────────────
  nodejs-build:
    name: Node.js backend
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: back-end
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: back-end/package-lock.json

      - name: Install dependencies
        run: npm ci || npm install

      - name: Lint (nếu có)
        run: npm run lint --if-present

      - name: Test (nếu có)
        run: npm test --if-present

  # ─── 2. .NET 10 customer-api ─────────────────────────────────────────────
  dotnet-build:
    name: .NET customer-api
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: customer-api
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Restore dependencies
        run: dotnet restore

      - name: Build (Release, no warning)
        run: dotnet build --configuration Release --no-restore -warnaserror

      - name: Test (nếu có test project)
        run: dotnet test --no-build --configuration Release --verbosity normal
        continue-on-error: true   # chưa có test, không fail pipeline

  # ─── 3. Docker build (verify Dockerfile không lỗi) ───────────────────────
  docker-build:
    name: Docker build
    runs-on: ubuntu-latest
    needs: [nodejs-build, dotnet-build]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build backend image
        uses: docker/build-push-action@v5
        with:
          context: ./back-end
          push: false
          tags: restomanager-backend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build customer-api image
        uses: docker/build-push-action@v5
        with:
          context: ./customer-api
          push: false
          tags: restomanager-customer-api:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Build frontend image
        uses: docker/build-push-action@v5
        with:
          context: ./front-end
          push: false
          tags: restomanager-frontend:ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

  # ─── 4. (Manual) Deploy VPS staging ──────────────────────────────────────
  # Chạy manual qua tab Actions → "CI" → Run workflow khi muốn deploy.
  # Không auto-deploy để tránh build fail làm sập VPS (lời khuyên thầy).
  deploy-staging:
    name: Deploy to Staging VPS (manual)
    runs-on: ubuntu-latest
    needs: [docker-build]
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/staging'
    steps:
      - uses: actions/checkout@v4

      - name: SSH deploy
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.STAGING_HOST }}
          username: ${{ secrets.STAGING_USER }}
          key: ${{ secrets.STAGING_SSH_KEY }}
          script: |
            cd /opt/restomanager
            git pull origin staging
            docker compose -f docker-compose.yml -f docker-compose.staging.yml \
                           pull && \
            docker compose -f docker-compose.yml -f docker-compose.staging.yml \
                           up -d
