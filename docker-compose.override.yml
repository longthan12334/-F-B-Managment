# =============================================================================
#  docker-compose.override.yml — DEV only, Docker Compose đọc tự động nếu có
#  (Buổi 11: Dev/Staging/Prod separation)
#
#  Dành cho máy dev: expose debug port, verbose logging.
#  KHÔNG DÙNG ở staging/production (các môi trường đó dùng -f file khác).
# =============================================================================

services:
  customer-api:
    environment:
      ASPNETCORE_ENVIRONMENT: Development
      Logging__LogLevel__Default: Debug
    # Nếu muốn hot-reload code: uncomment volumes bên dưới + đổi Dockerfile sang SDK image.
    # volumes:
    #   - ./customer-api:/src
    #   - /src/bin
    #   - /src/obj

  backend:
    environment:
      NODE_ENV: development
      LOG_LEVEL: debug
