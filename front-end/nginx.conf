# =============================================================================
#  Nginx — phục vụ React SPA + proxy tới backend
# -----------------------------------------------------------------------------
#  Ở production, Caddy đứng trước Nginx (TLS + domain), Nginx chỉ làm hai việc:
#    1. Trả tệp tĩnh đã build của Vite.
#    2. Chuyển tiếp /api và /socket.io sang backend.
#
#  Giữ Nginx trong kiến trúc (thay vì để Caddy gọi thẳng tệp tĩnh) để môi
#  trường phát triển và production chạy cùng một ảnh frontend — thứ chạy trên
#  máy lập trình viên chính là thứ chạy trên VPS.
# =============================================================================
user  nginx;
worker_processes auto;
error_log /var/log/nginx/error.log warn;
events { worker_connections 1024; }

http {
  include       /etc/nginx/mime.types;
  default_type  application/octet-stream;

  sendfile      on;
  tcp_nopush    on;
  tcp_nodelay   on;
  keepalive_timeout 65;
  server_tokens off;
  client_max_body_size 10m;

  # Nén — Caddy cũng nén, nhưng giữ ở đây để chạy độc lập vẫn nhanh
  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css application/javascript application/json
             image/svg+xml application/xml font/woff2;

  log_format  main '$remote_addr - $status "$request" $body_bytes_sent "$http_user_agent"';
  access_log /var/log/nginx/access.log main;

  # Bắt buộc khi proxy WebSocket
  map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
  }

  upstream restomanager_backend {
    server backend:3000;
    keepalive 16;
  }

  server {
    listen      80;
    server_name _;
    root        /usr/share/nginx/html;
    index       index.html;

    # Healthcheck của Docker Compose
    location = /healthz {
      access_log off;
      add_header Content-Type text/plain;
      return 200 'ok';
    }

    # ─── REST API ───────────────────────────────────────────────────────
    location /api/ {
      proxy_pass         http://restomanager_backend/api/;
      proxy_http_version 1.1;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_set_header   Connection        "";
      proxy_read_timeout 60s;
    }

    # ─── Socket.IO ──────────────────────────────────────────────────────
    location /socket.io/ {
      proxy_pass         http://restomanager_backend/socket.io/;
      proxy_http_version 1.1;
      proxy_set_header   Upgrade           $http_upgrade;
      proxy_set_header   Connection        $connection_upgrade;
      proxy_set_header   Host              $host;
      proxy_set_header   X-Real-IP         $remote_addr;
      proxy_set_header   X-Forwarded-For   $proxy_add_x_forwarded_for;
      proxy_set_header   X-Forwarded-Proto $scheme;
      proxy_read_timeout 3600s;
      proxy_send_timeout 3600s;
      proxy_buffering    off;
    }

    # ─── Tài nguyên tĩnh của Vite ───────────────────────────────────────
    # Tên tệp có băm nội dung nên cache vĩnh viễn được.
    location /assets/ {
      try_files $uri =404;
      expires 1y;
      access_log off;
      add_header Cache-Control "public, immutable";
    }

    # ─── Fallback cho React Router ──────────────────────────────────────
    # index.html KHÔNG được cache: nếu cache, người dùng vẫn tải bản cũ và
    # tham chiếu tới tệp /assets/ đã bị xoá sau lần deploy mới.
    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "no-cache, must-revalidate";
    }

    # Chặn truy cập tệp ẩn
    location ~ /\. { deny all; }
  }
}
